name: Check Mori

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo +stable fmt --check
      - name: Clippy
        run: cargo +stable clippy --locked --all-targets --features visual-test -- -D warnings
      - name: Tests
        env:
          CARGO_TERM_COLOR: never
        shell: pwsh
        run: |
          $output = cargo +stable test --locked 2>&1 | Tee-Object -FilePath tests.log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            $details = ($output | Select-Object -Last 160) -join "`n"
            $escaped = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Rust test failure::$escaped"
          }
          exit $testExit
      - name: Release build
        run: cargo +stable build --locked --release

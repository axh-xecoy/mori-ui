[package]
name = "mori-ui"
version = "1.0.0"
edition = "2024"
description = "A considered, native AI conversation client"
license = "MIT"

[features]
visual-test = ["gpui-kit/test-support"]

[[bin]]
name = "mori"
path = "src/main.rs"

[dependencies]
gpui-kit = { version = "=0.7.3", features = ["tree-sitter", "tree-sitter-bash", "tree-sitter-python", "tree-sitter-rust", "tree-sitter-javascript", "tree-sitter-typescript", "tree-sitter-tsx", "tree-sitter-html", "tree-sitter-css", "tree-sitter-go", "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-sql", "tree-sitter-toml", "tree-sitter-yaml"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "multipart"] }
base64 = "0.22"
sha2 = "=0.10.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
rfd = "0.15"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
cpal = "0.16"
hound = "3.5"
pdf-extract = "0.12"
ratex-parser = "=0.1.14"
ratex-layout = "=0.1.14"
ratex-types = "=0.1.14"
ratex-render = { version = "=0.1.14", features = ["embed-fonts"] }

[build-dependencies]
embed-resource = "=3.0.12"

[dev-dependencies]
markdown = "=1.0.0"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true

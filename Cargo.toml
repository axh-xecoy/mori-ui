[package]
name = "mori-ui"
version = "0.1.0"
edition = "2024"
description = "A considered, native AI conversation client"
license = "MIT"

[features]
visual-test = ["gpui-kit/test-support"]

[[bin]]
name = "mori"
path = "src/main.rs"

[dependencies]
gpui-kit = "=0.7.3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "multipart"] }
base64 = "0.22"
rfd = "0.15"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
cpal = "0.16"
hound = "3.5"
pdf-extract = "0.12"

[build-dependencies]
embed-resource = "=3.0.12"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true
